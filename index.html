<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꧁༒Legend༒꧂</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="Logo.png" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: #0f1014;
            color: #ffffff;
            overflow: hidden; 
        }

        .bg-image {
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Orqa planga o'tkazish */
            filter: brightness(0.6); /* Biroz qoraytirish */
            transform: scale(1.05); /* Har xil animatsiyalar qo'shish uchun ozgina kattalashtirish */
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%); */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url('/pubg_bg.png'); 
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        /* Asosiy card (oyna effekti) */
        .profile-container {
            background: rgba(30, 30, 40, 0.4);
            backdrop-filter: blur(10px); /* Oyna xiraligi */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        /* Yuqoridagi sariq chiziq (PUBG uslubida) */
        .profile-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #f2a900; /* PUBG Sariq/Apelsin rangi */
        }

        /* Paydo bo'lish animatsiyasi */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Matn stillari */
        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 40px;
        }

        /* Tugmalar konteyneri */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Asosiy tugma stili */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 1.2rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05); /* Yengil fonga ega */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Yupqa chegara */
        }

        .link-btn:hover {
            transform: translateY(-3px); /* Biros tepaga ko'tarilishi */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        /* YouTube tugmasi uchun maxsus ranglar */
        .yt-btn {
            border-left: 4px solid #ff0000;
        }
        .yt-btn i {
            color: #ff0000;
            font-size: 1.5rem;
        }

        /* Telegram tugmasi uchun maxsus ranglar */
        .tg-btn {
            border-left: 4px solid #0088cc;
        }
        .tg-btn i {
            color: #0088cc;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay">
        <div class="profile-container">
            <h1>PUBG PLAYER</h1>
            <p>Xush kelibsan bratishka mani web sayitimga!!!</p>
            
            <div class="links-container">
                <a href="https://www.youtube.com/@legend_o75.no1" target="_blank" class="link-btn yt-btn">
                    <i class="fab fa-youtube"></i>
                    YouTube Kanalim
                </a>
                
                <a href="https://t.me/Makedonyalik_Iskandar" target="_blank" class="link-btn tg-btn">
                    <i class="fab fa-telegram"></i>
                    Telegram Lichkam
                </a>
            </div>
        </div>
    </div>
</body>
</html>
